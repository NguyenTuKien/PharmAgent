apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-config
data:
  DEBUG: {{ .Values.env.DEBUG | quote }}
  BACKEND_URL: {{ .Values.env.BACKEND_URL | quote }}
  AGENT_URL: {{ .Values.env.AGENT_URL | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  CORS_ORIGINS: {{ .Values.env.CORS_ORIGINS | quote }}
