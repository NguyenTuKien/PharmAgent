fullnameOverride: gateway

replicaCount: 1

image:
  repository: gateway
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: api.pharmagent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  DEBUG: "false"
  BACKEND_URL: "http://backend-service:8080"
  AGENT_URL: "http://agent-service:8000"
  REDIS_URL: "redis://redis-master:6379"
  CORS_ORIGINS: "http://localhost:5173"

# Các giá trị nhạy cảm nên để ở Secret
secret:
  JWT_SECRET: "<set-via-secret>"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
