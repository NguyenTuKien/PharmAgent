services:
  database:
    image: mongo:7
    restart: always
    env_file: .env
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmagent-network

  redis:
    image: redis:7-alpine
    restart: always
    env_file: .env
    command: /bin/sh -c 'redis-server --requirepass "$${SPRING_DATA_REDIS_PASSWORD}"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${SPRING_DATA_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - pharmagent-network

  rabbitmq:
    image: rabbitmq:3.11-management
    restart: always
    env_file: .env
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pharmagent-network

  backend:
    build: ./backend
    image: ${DOCKER_REGISTRY:-ghcr.io/nguyentukien}/pharmagent-backend:${TAG:-latest}
    restart: always
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - backend_logs:/app/logs
    networks:
      - pharmagent-network
  
  cloudflare:
    image: cloudflare/cloudflared:2024.6.0
    restart: always
    env_file: .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pharmagent-network

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
  backend_logs:

networks:
  pharmagent-network:
    driver: bridge