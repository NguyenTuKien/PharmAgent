services:
  database:
    image: mongo:7
    restart: always
    env_file: .env
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  redis:  
    image: redis:7-alpine
    restart: always
    command: /bin/sh -c 'redis-server --requirepass "$$SPRING_DATA_REDIS_PASSWORD"'
    env_file: .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$SPRING_DATA_REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: always
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp rabbitmq_web_stomp
      && rabbitmq-server"
    env_file: .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  backend:
    build: ./backend
    image: ghcr.io/nguyentukien/web-backend:${TAG:-latest}
    restart: always
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep UP || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - backend_logs:/app/logs
    networks:
      - web

  # agent:
  #   build: ./agent
  #   image: ghcr.io/nguyentukien/web-agent:${TAG:-latest}
  #   restart: always
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - agent_logs:/app/logs
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - web

  # frontend:
  #   build: ./frontend
  #   image: ghcr.io/nguyentukien/web-frontend:${TAG:-latest}
  #   restart: always
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #     agent:
  #       condition: service_healthy
  #   networks:
  #     - web
  
  cloudflare:
    image: cloudflare/cloudflared:2024.6.0
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
  agent_logs:
  backend_logs:

networks:
  web:
    driver: bridge