services:
  database:
    image: mongo:7
    restart: always
    env_file: .env
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmagent-network

  redis:
    image: redis:7-alpine
    restart: always
    env_file: .env
    command: /bin/sh -c 'redis-server --requirepass "$${SPRING_DATA_REDIS_PASSWORD}"'
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${SPRING_DATA_REDIS_PASSWORD}\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - pharmagent-network

  rabbitmq:
    image: rabbitmq:3.11-management
    restart: always
    env_file: .env
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pharmagent-network

  agent:
    build: ./agent
    image: ${DOCKER_REGISTRY:-ghcr.io/nguyentukien}/pharmagent-agent:${TAG:-latest}
    restart: always
    env_file: .env
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/ws/health || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - pharmagent-network

  backend:
    build: ./backend
    image: ${DOCKER_REGISTRY:-ghcr.io/nguyentukien}/pharmagent-backend:${TAG:-latest}
    restart: always
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - backend_logs:/app/logs
    networks:
      - pharmagent-network

  gateway:
    build: ./gateway
    image: ${DOCKER_REGISTRY:-ghcr.io/nguyentukien}/pharmagent-gateway:${TAG:-latest}
    restart: always
    env_file: .env
    ports: [ "9000:9000" ]
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - pharmagent-network

  frontend:
    image: node:24-alpine
    restart: always
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_GATEWAY_PROXY_TARGET: http://gateway:9000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - pharmagent-network

