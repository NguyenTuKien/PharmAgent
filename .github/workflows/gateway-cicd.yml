name: Gateway CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write
  packages: write
  actions: read

jobs:
  filter:
    name: Check Changed Paths
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'gateway/**'

  unit_test_job:
    name: Lint Gateway
    needs: filter
    if: needs.filter.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for Gateway Lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: gateway/requirements.txt

      - name: Install Gateway Dependencies
        working-directory: ./gateway
        run: pip install -r requirements.txt --quiet

      - name: Lint Gateway import and syntax check
        working-directory: ./gateway
        run: |
          python -c "from app.main import app; print('✅ Gateway import OK')"
          python -m py_compile app/main.py app/config.py             app/utils/jwt_utils.py app/utils/redis_client.py             app/middleware/auth.py app/middleware/rate_limit.py             app/middleware/logging.py             app/routers/proxy.py app/routers/backend.py app/routers/agent.py
          echo "✅ Gateway syntax OK" >> $GITHUB_STEP_SUMMARY

  helm_lint_job:
    name: Helm Chart Lint (Gateway)
    needs: filter
    if: needs.filter.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Lint Gateway Helm Chart if exists
        run: |
          if [ -d ./gateway/helm ]; then
            helm lint ./gateway/helm
          else
            echo "No Gateway Helm chart found, skip Helm lint"
          fi

  tag_job:
    name: Get Image Tag
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request'
    outputs:
      docker_tag: ${{ steps.calc_tag.outputs.tag }}
    steps:
      - name: Tính toán Tag tự động
        id: calc_tag
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            echo "tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          fi

  build_job:
    name: Build Docker Image (Gateway)
    runs-on: ubuntu-latest
    needs: [filter, unit_test_job, helm_lint_job, tag_job]
    if: >
      always() &&
      needs.filter.outputs.gateway == 'true' &&
      needs.unit_test_job.result == 'success' &&
      needs.helm_lint_job.result == 'success' &&
      needs.tag_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Gateway
        run: |
          docker pull $REGISTRY_IMAGE/pharmagent-gateway:$BUILD_TAG || true
          docker build --cache-from $REGISTRY_IMAGE/pharmagent-gateway:$BUILD_TAG -t $REGISTRY_IMAGE/pharmagent-gateway:$BUILD_TAG ./gateway
          docker push $REGISTRY_IMAGE/pharmagent-gateway:$BUILD_TAG

      - name: Cleanup Docker System
        if: always()
        run: docker system prune -af

  wait_for_dependencies:
    name: Wait for Backend & Agent Pipelines
    runs-on: ubuntu-latest
    needs: [filter, build_job]
    if: >
      always() &&
      needs.filter.outputs.gateway == 'true' &&
      needs.build_job.result == 'success'
    permissions:
      actions: read
    steps:
      - name: Wait for Agent pipeline to complete
        run: |
          echo "Waiting for agent-cicd workflow..."
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          for i in $(seq 1 30); do
            # Thử tìm run trên cùng nhánh trước
            RUN_DATA=$(gh run list --repo ${{ github.repository }} --workflow=agent-cicd.yml --branch="$BRANCH_NAME" --limit=1 --json status,conclusion,databaseId 2>/dev/null || echo "[]")
            
            # Nếu không tìm thấy trên nhánh hiện tại (có thể do pipeline bị skip), lấy run gần nhất của workflow đó
            if [ "$RUN_DATA" = "[]" ]; then
              RUN_DATA=$(gh run list --repo ${{ github.repository }} --workflow=agent-cicd.yml --limit=1 --json status,conclusion,databaseId 2>/dev/null || echo "[]")
            fi
            STATUS=$(echo "$RUN_DATA" | jq -r '.[0].status // "unknown"')
            CONCLUSION=$(echo "$RUN_DATA" | jq -r '.[0].conclusion // "null"')
            RUN_ID=$(echo "$RUN_DATA" | jq -r '.[0].databaseId // "none"')
            
            echo "  [${i}/30] Agent Run ID: $RUN_ID | Status: $STATUS | Conclusion: $CONCLUSION"
            
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ Agent pipeline succeeded!"; break
              else
                echo "⚠️ Agent pipeline completed with: $CONCLUSION. Continuing anyway..."
                break
              fi
            fi
            sleep 30
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Wait for Backend pipeline to complete
        run: |
          echo "Waiting for backend-cicd workflow..."
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          for i in $(seq 1 30); do
            # Thử tìm run trên cùng nhánh trước
            RUN_DATA=$(gh run list --repo ${{ github.repository }} --workflow=backend-cicd.yml --branch="$BRANCH_NAME" --limit=1 --json status,conclusion,databaseId 2>/dev/null || echo "[]")
            
            # Nếu không tìm thấy trên nhánh hiện tại, lấy run gần nhất của workflow đó
            if [ "$RUN_DATA" = "[]" ]; then
              RUN_DATA=$(gh run list --repo ${{ github.repository }} --workflow=backend-cicd.yml --limit=1 --json status,conclusion,databaseId 2>/dev/null || echo "[]")
            fi
            STATUS=$(echo "$RUN_DATA" | jq -r '.[0].status // "unknown"')
            CONCLUSION=$(echo "$RUN_DATA" | jq -r '.[0].conclusion // "null"')
            RUN_ID=$(echo "$RUN_DATA" | jq -r '.[0].databaseId // "none"')
            
            echo "  [${i}/30] Backend Run ID: $RUN_ID | Status: $STATUS | Conclusion: $CONCLUSION"
            
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ Backend pipeline succeeded!"; break
              else
                echo "⚠️ Backend pipeline completed with: $CONCLUSION. Continuing anyway..."
                break
              fi
            fi
            sleep 30
          done
        env:
          GH_TOKEN: ${{ github.token }}

  integration_test_job:
    name: Integration Test (Gateway)
    runs-on: ubuntu-latest
    needs: [tag_job, build_job, wait_for_dependencies]
    if: >
      always() &&
      needs.tag_job.result == 'success' &&
      needs.build_job.result == 'success' &&
      needs.wait_for_dependencies.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment Variables
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "ERROR: ENV_FILE secret is not set in GitHub"
            exit 1
          fi

          echo "${{ secrets.ENV_FILE }}" > .env
          # Dùng TAG đúng được tính từ tag_job (SHA hoặc latest nếu ở main)
          echo "TAG=$TAG" >> .env
          echo "DOCKER_REGISTRY=$REGISTRY_IMAGE" >> .env

      - name: Pull Gateway image
        run: docker pull $REGISTRY_IMAGE/pharmagent-gateway:$TAG

      - name: Resolve & Pull dependency images (Backend & Agent)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for svc in backend agent; do
            echo "=== Resolving image for $svc ==="
            # Thử pull đúng SHA trước (service này vừa được build ở cùng commit)
            if docker pull $REGISTRY_IMAGE/pharmagent-$svc:$TAG 2>/dev/null; then
              echo "✅ Pulled $svc:$TAG from GHCR"
            else
              echo "ℹ️  $svc:$TAG not found. Querying GitHub Packages API for latest SHA..."
              # Lấy tag SHA mới nhất của service (không phải 'latest') qua GitHub API
              LATEST_SHA=$(curl -s \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/users/${OWNER}/packages/container/pharmagent-${svc}/versions?per_page=5" \
                | jq -r '[.[] | select(.metadata.container.tags[]? | (. != "latest"))] | .[0].metadata.container.tags[] | select(. != "latest")' 2>/dev/null | head -1)

              if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "null" ]; then
                echo "Found latest SHA for $svc: $LATEST_SHA"
                docker pull $REGISTRY_IMAGE/pharmagent-$svc:$LATEST_SHA
                # Retag cục bộ thành $TAG để docker-compose nhận diện được
                docker tag $REGISTRY_IMAGE/pharmagent-$svc:$LATEST_SHA $REGISTRY_IMAGE/pharmagent-$svc:$TAG
                echo "✅ Retagged $svc:$LATEST_SHA → $svc:$TAG (local only)"
              else
                echo "❌ Could not resolve any image for $svc. Aborting."
                exit 1
              fi
            fi
          done

      - name: Start services with Docker Compose
        run: docker compose up -d --no-build gateway

      - name: Wait for Gateway to be Healthy
        run: |
          echo "Waiting for gateway to be healthy (timeout: 300s, backend+agent must start first)..."
          for i in $(seq 1 20); do
            if docker compose ps gateway | grep -q "healthy"; then
              echo "✅ Gateway is healthy after $((i * 15))s!"
              exit 0
            fi
            echo "  [${i}/20] Still starting... waiting 15s"
            docker compose ps --format "table {{.Service}}\t{{.Status}}" 2>/dev/null || true
            sleep 15
          done
          echo "❌ Gateway did not become healthy after 300s!"
          docker compose logs gateway
          docker compose logs backend || true
          docker compose logs agent || true
          exit 1

      - name: Smoke Test Gateway HTTP
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/health || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Gateway /health responded 200"
          else
            echo "❌ Gateway /health returned HTTP $STATUS"
            docker compose logs gateway
            exit 1
          fi

      - name: Cleanup Docker System
        if: always()
        run: |
          docker compose down --volumes --rmi local
          docker system prune -a -f

  security_scan:
    name: Security Scan (Gateway)
    runs-on: ubuntu-latest
    needs: [tag_job, build_job]
    if: >
      always() &&
      needs.tag_job.result == 'success' &&
      needs.build_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    continue-on-error: true
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner - Gateway Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './gateway'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner - Gateway Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_IMAGE }}/pharmagent-gateway:${{ env.BUILD_TAG }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  update_config:
    name: Update Config (Gateway)
    needs: [filter, tag_job, helm_lint_job, integration_test_job, security_scan]
    runs-on: ubuntu-latest
    if: >
      always() &&
      needs.filter.outputs.gateway == 'true' &&
      needs.tag_job.result == 'success' &&
      needs.helm_lint_job.result == 'success' &&
      needs.integration_test_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
      REPO_CONFIG: ${{ vars.REPO_CONFIG }}
    steps:
      - name: Checkout Source Code (GitHub)
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Clone Config Repo (GitLab)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
          git clone ${REPO_CONFIG} Config

      - name: Update Gateway Config Tag for Staging
        run: |
          cd Config
          GATEWAY_TARGET_FILE="app/gateway/values-prod.yaml"

          yq -i '.image.tag = strenv(BUILD_TAG)' "$GATEWAY_TARGET_FILE"
          git add "$GATEWAY_TARGET_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "CD: Update gateway image tag to ${{ env.BUILD_TAG }}" || echo "No changes to commit"
          git push origin main --force

  notify_success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [update_config]
    if: >
      always() &&
      needs.update_config.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    steps:
      - name: Send Discord Notification - Success
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \"✅ **GATEWAY PIPELINE SUCCESS!** 🚀\\n**Project:** ${{ github.repository }}\\n**${{ github.event_name == 'pull_request' && 'Pull Request' || 'Branch/Tag' }}:** ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}\\n**User:** ${{ github.actor }}\\n**Service:** gateway\\n**Status:** 🟢 Thành công\\n👉 [Xem Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

  notify_fail:
    name: Notify Fail
    runs-on: ubuntu-latest
    needs:
      - filter
      - unit_test_job
      - helm_lint_job
      - tag_job
      - build_job
      - integration_test_job
      - security_scan
      - update_config
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Send Discord Notification - Failed
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \"🚨 **GATEWAY PIPELINE FAILED!** 💥\\n**Project:** ${{ github.repository }}\\n**Branch/Tag:** ${{ github.ref_name }}\\n**User:** ${{ github.actor }}\\n**Service:** gateway\\n**Status:** 🔴 Thất bại\\n👉 [Xem lỗi tại đây](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
