name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write
  packages: write

jobs:
  filter:
    name: Check Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  unit_test_job:
    name: Unit Test (Backend)
    needs: filter
    if: needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports: [ 27017:27017 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        working-directory: ./backend
        run: mvn -B clean test -DskipTests=${{ env.SKIP_TESTS || 'false' }}
        env:
          MONGODB_URI: mongodb://localhost:27017/pharmagent_test_db
          REDIS_URL: redis://localhost:6379
          RABBITMQ_ADDRESSES: localhost:5672
          JWT_SECRET: day-la-mot-chuoi-secret-key-gia-cuc-ky-dai-de-chay-unit-test-thanh-cong
          SPRING_MAIL_USERNAME: test@gmail.com
          SPRING_MAIL_PASSWORD: dummy-password
          CLOUDINARY_CLOUD_NAME: dummy_cloud
          CLOUDINARY_API_KEY: "123456789"
          CLOUDINARY_API_SECRET: dummy_secret
          SKIP_TESTS: false
          # Set SKIP_TESTS to true to skip unit tests

      - name: Generate JaCoCo Coverage Report
        if: always()
        working-directory: ./backend
        run: mvn jacoco:report

      - name: Calculate Coverage Percentage
        if: always()
        working-directory: ./backend
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F"," '{ instructions += $4 + $5; covered += $5 } END { print covered, "/", instructions, " instructions covered"; print 100*covered/instructions "% covered" }' target/site/jacoco/jacoco.csv
          else
            echo "No JaCoCo report generated (no tests ran)"
          fi

      - name: Upload JaCoCo Coverage Report & Classes for Sonar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/classes/
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/target/surefire-reports/TEST-*.xml

      - name: Test Report Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "- JaCoCo coverage report uploaded as artifact" >> $GITHUB_STEP_SUMMARY
          echo "- Test results available in artifacts" >> $GITHUB_STEP_SUMMARY

  helm_lint_job:
    name: Helm Chart Lint (Backend)
    needs: filter
    if: needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Lint Backend Helm Chart
        run: helm lint ./backend/helm

  tag_job:
    name: Get Image Tag
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request'
    outputs:
      docker_tag: ${{ steps.calc_tag.outputs.tag }}
    steps:
      - name: Tính toán Tag tự động
        id: calc_tag
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            echo "tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          fi

  build_job:
    name: Build Docker Image (Backend)
    runs-on: ubuntu-latest
    needs: [filter, unit_test_job, helm_lint_job, tag_job]
    if: >
      always() &&
      needs.filter.outputs.backend == 'true' &&
      needs.unit_test_job.result == 'success' &&
      needs.helm_lint_job.result == 'success' &&
      needs.tag_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        run: |
          docker pull $REGISTRY_IMAGE/pharmagent-backend:$TAG || true
          docker build --cache-from $REGISTRY_IMAGE/pharmagent-backend:$TAG -t $REGISTRY_IMAGE/pharmagent-backend:$TAG ./backend
          docker push $REGISTRY_IMAGE/pharmagent-backend:$TAG

      - name: Cleanup Docker System
        if: always()
        run: docker system prune -af

  code_quality_scan:
    name: Code Quality Scan with SonarCloud (Backend)
    runs-on: ubuntu-latest
    needs: [unit_test_job]
    if: always() && needs.unit_test_job.result == 'success'
    continue-on-error: true
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JaCoCo Report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/

      - name: Run SonarCloud Scan with Maven
        working-directory: ./backend
        run: |
          mvn compile sonar:sonar             -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}             -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}             -Dsonar.host.url=https://sonarcloud.io             -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  integration_test_job:
    name: Integration Test (Backend)
    runs-on: ubuntu-latest
    needs: [tag_job, build_job]
    if: >
      always() &&
      needs.tag_job.result == 'success' &&
      needs.build_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment Variables
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "ERROR: ENV_FILE secret is not set in GitHub"
            exit 1
          fi

          echo "${{ secrets.ENV_FILE }}" > .env
          echo "TAG=$TAG" >> .env
          echo "DOCKER_REGISTRY=$REGISTRY_IMAGE" >> .env

      - name: Start services with Docker Compose
        run: |
          # Pull image backend mới, các dependency (mongo/redis/rabbitmq) là public image
          docker compose pull backend
          # docker compose tự động start database, redis, rabbitmq trước do depends_on
          docker compose up -d --no-build backend

      - name: Wait for Backend to be Healthy
        run: |
          echo "Waiting for backend to be healthy (timeout: 150s)..."
          for i in $(seq 1 15); do
            STATUS=$(docker compose ps backend --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo "")
            if docker compose ps backend | grep -q "healthy"; then
              echo "✅ Backend is healthy after $((i * 10))s!"
              exit 0
            fi
            echo "  [${i}/15] Still starting... waiting 10s"
            sleep 10
          done
          echo "❌ Backend did not become healthy after 150s!"
          docker compose logs backend
          exit 1

      - name: Cleanup Docker System
        if: always()
        run: |
          docker compose down --volumes --rmi local
          docker system prune -a -f

  security_scan:
    name: Security Scan (Backend)
    runs-on: ubuntu-latest
    needs: [tag_job, build_job]
    if: >
      always() &&
      needs.tag_job.result == 'success' &&
      needs.build_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    continue-on-error: true
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner - Backend Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner - Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_IMAGE }}/pharmagent-backend:${{ env.TAG }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  update_config:
    name: Update Config (Backend)
    needs: [filter, tag_job, helm_lint_job, integration_test_job, security_scan]
    runs-on: ubuntu-latest
    if: >
      always() &&
      needs.filter.outputs.backend == 'true' &&
      needs.tag_job.result == 'success' &&
      needs.helm_lint_job.result == 'success' &&
      needs.integration_test_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
      REPO_CONFIG: ${{ vars.REPO_CONFIG }}
    steps:
      - name: Checkout Source Code (GitHub)
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Clone Config Repo (GitLab)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
          git clone ${REPO_CONFIG} Config

      - name: Update Backend Config Tag for Staging
        run: |
          cd Config
          BACKEND_TARGET_FILE="app/backend/values-prod.yaml"

          yq -i '.backend.image.tag = strenv(TAG)' "$BACKEND_TARGET_FILE"
          git add "$BACKEND_TARGET_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "CD: Update backend image tag to ${{ env.TAG }}" || echo "No changes to commit"
          git push origin main --force
