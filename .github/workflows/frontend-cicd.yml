name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write
  packages: write
  actions: read

jobs:
  filter:
    name: Check Changed Paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  unit_test_job:
    name: Lint & Test Frontend
    needs: filter
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Test Frontend
        working-directory: ./frontend
        run: npm run test || echo "Tests failed or not configured, continuing"

  helm_lint_job:
    name: Helm Chart Lint (Frontend)
    needs: filter
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Lint Frontend Helm Chart if exists
        run: |
          if [ -d ./frontend/helm ]; then
            helm lint ./frontend/helm
          else
            echo "No Frontend Helm chart found, skip Helm lint"
          fi

  tag_job:
    name: Get Image Tag
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request'
    outputs:
      docker_tag: ${{ steps.calc_tag.outputs.tag }}
    steps:
      - name: Tính toán Tag tự động
        id: calc_tag
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            echo "tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          fi

  build_job:
    name: Build Docker Image (Frontend)
    runs-on: ubuntu-latest
    needs: [filter, unit_test_job, helm_lint_job, tag_job]
    if: >
      always() &&
      needs.filter.outputs.frontend == 'true' &&
      needs.unit_test_job.result == 'success' &&
      needs.helm_lint_job.result == 'success' &&
      needs.tag_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        run: |
          docker pull $REGISTRY_IMAGE/pharmagent-frontend:$TAG || true
          docker build --cache-from $REGISTRY_IMAGE/pharmagent-frontend:$TAG -t $REGISTRY_IMAGE/pharmagent-frontend:$TAG ./frontend
          docker push $REGISTRY_IMAGE/pharmagent-frontend:$TAG

      - name: Cleanup Docker System
        if: always()
        run: docker system prune -af

  wait_for_dependencies:
    name: Wait for Gateway Pipeline
    runs-on: ubuntu-latest
    needs: [filter, build_job]
    if: >
      always() &&
      needs.filter.outputs.frontend == 'true' &&
      needs.build_job.result == 'success'
    permissions:
      actions: read
    steps:
      - name: Wait for Gateway pipeline to complete
        run: |
          echo "Waiting for gateway-cicd workflow..."
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          for i in $(seq 1 30); do
            RUN_DATA=$(gh run list --repo ${{ github.repository }} --workflow=gateway-cicd.yml --branch="$BRANCH_NAME" --limit=1 --json status,conclusion,databaseId 2>/dev/null || echo "[]")
            
            if [ "$RUN_DATA" = "[]" ]; then
              RUN_DATA=$(gh run list --repo ${{ github.repository }} --workflow=gateway-cicd.yml --limit=1 --json status,conclusion,databaseId 2>/dev/null || echo "[]")
            fi
            STATUS=$(echo "$RUN_DATA" | jq -r '.[0].status // "unknown"')
            CONCLUSION=$(echo "$RUN_DATA" | jq -r '.[0].conclusion // "null"')
            RUN_ID=$(echo "$RUN_DATA" | jq -r '.[0].databaseId // "none"')
            
            echo "  [${i}/30] Gateway Run ID: $RUN_ID | Status: $STATUS | Conclusion: $CONCLUSION"
            
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ Gateway pipeline succeeded!"; break
              else
                echo "⚠️ Gateway pipeline completed with: $CONCLUSION. Continuing anyway..."
                break
              fi
            fi
            sleep 30
          done
        env:
          GH_TOKEN: ${{ github.token }}

  integration_test_job:
    name: Integration Test (Frontend)
    runs-on: ubuntu-latest
    needs: [tag_job, build_job, wait_for_dependencies]
    if: >
      always() &&
      needs.tag_job.result == 'success' &&
      needs.build_job.result == 'success' &&
      needs.wait_for_dependencies.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment Variables
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "ERROR: ENV_FILE secret is not set in GitHub"
            exit 1
          fi

          echo "${{ secrets.ENV_FILE }}" > .env
          echo "TAG=$TAG" >> .env
          echo "DOCKER_REGISTRY=$REGISTRY_IMAGE" >> .env

      - name: Pull Frontend image
        run: docker pull $REGISTRY_IMAGE/pharmagent-frontend:$TAG

      - name: Resolve & Pull dependency images (Gateway, Backend, Agent)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          for svc in gateway backend agent; do
            echo "=== Resolving image for $svc ==="
            if docker pull $REGISTRY_IMAGE/pharmagent-$svc:$TAG 2>/dev/null; then
              echo "✅ Pulled $svc:$TAG from GHCR"
            else
              echo "ℹ️  $svc:$TAG not found. Querying GitHub Packages API for latest SHA..."
              LATEST_SHA=$(curl -s \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/users/${OWNER}/packages/container/pharmagent-${svc}/versions?per_page=5" \
                | jq -r '[.[] | select(.metadata.container.tags[]? | (. != "latest"))] | .[0].metadata.container.tags[] | select(. != "latest")' 2>/dev/null | head -1)

              if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "null" ]; then
                echo "Found latest SHA for $svc: $LATEST_SHA"
                docker pull $REGISTRY_IMAGE/pharmagent-$svc:$LATEST_SHA
                docker tag $REGISTRY_IMAGE/pharmagent-$svc:$LATEST_SHA $REGISTRY_IMAGE/pharmagent-$svc:$TAG
                echo "✅ Retagged $svc:$LATEST_SHA → $svc:$TAG (local only)"
              else
                echo "❌ Could not resolve any image for $svc. Aborting."
                exit 1
              fi
            fi
          done

      - name: Start services with Docker Compose
        run: docker compose up -d --no-build frontend

      - name: Wait for Frontend to be Healthy
        run: |
          echo "Waiting for frontend to be healthy (timeout: 300s)..."
          for i in $(seq 1 20); do
            if docker compose ps frontend | grep -q "healthy"; then
              echo "✅ Frontend is healthy after $((i * 15))s!"
              exit 0
            fi
            echo "  [${i}/20] Still starting... waiting 15s"
            docker compose ps --format "table {{.Service}}\t{{.Status}}" 2>/dev/null || true
            sleep 15
          done
          echo "❌ Frontend did not become healthy after 300s!"
          docker compose logs frontend
          docker compose logs gateway || true
          exit 1

      - name: Smoke Test Frontend HTTP
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Frontend responded 200"
          else
            echo "❌ Frontend returned HTTP $STATUS"
            docker compose logs frontend
            exit 1
          fi

      - name: Cleanup Docker System
        if: always()
        run: |
          docker compose down --volumes --rmi local
          docker system prune -a -f

  security_scan:
    name: Security Scan (Frontend)
    runs-on: ubuntu-latest
    needs: [tag_job, build_job]
    if: >
      always() &&
      needs.tag_job.result == 'success' &&
      needs.build_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    continue-on-error: true
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        run: echo "REGISTRY_IMAGE=ghcr.io/${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner - Frontend Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy vulnerability scanner - Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY_IMAGE }}/pharmagent-frontend:${{ env.TAG }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  update_config:
    name: Update Config (Frontend)
    needs: [filter, tag_job, helm_lint_job, integration_test_job, security_scan]
    runs-on: ubuntu-latest
    if: >
      always() &&
      needs.filter.outputs.frontend == 'true' &&
      needs.tag_job.result == 'success' &&
      needs.helm_lint_job.result == 'success' &&
      needs.integration_test_job.result == 'success' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') ||
        github.event_name == 'pull_request'
      )
    env:
      TAG: ${{ needs.tag_job.outputs.docker_tag }}
      REPO_CONFIG: ${{ vars.REPO_CONFIG }}
    steps:
      - name: Checkout Source Code (GitHub)
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Clone Config Repo (GitLab)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
          git clone ${REPO_CONFIG} Config

      - name: Update Frontend Config Tag for Staging
        run: |
          cd Config
          FRONTEND_TARGET_FILE="app/frontend/values-prod.yaml"

          yq -i '.image.tag = strenv(TAG)' "$FRONTEND_TARGET_FILE"
          git add "$FRONTEND_TARGET_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "CD: Update frontend image tag to ${{ env.TAG }}" || echo "No changes to commit"
          git push origin main --force
