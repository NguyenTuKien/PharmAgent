spring:
  jackson:
    time-zone: Asia/Ho_Chi_Minh
#   config:
#     import:
# #      - optional:file:./.env[.properties]
#       - optional:file:./backend/.env[.properties]

  main:
    banner-mode: "off"
  application:
    name: backend
  mongodb:
    uri: ${MONGODB_URI}
  data:
    redis:
      url: ${REDIS_URL}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties: # <-- THÊM TOÀN BỘ PHẦN NÀY ĐỂ GMAIL HOẠT ĐỘNG
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  auth-expiration-ms: ${JWT_AUTH_EXPIRATION_MS:300000}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

server:
  servlet:
    context-path: /api
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    root: warn
    org.springframework.data.mongodb: info
    org.mongodb.driver: info

management:
  endpoints:
    web:
      exposure:
        include: health