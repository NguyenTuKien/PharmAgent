  # Sensitive/Secret variables like passwords can be configured here or via secrets:
  # - name: SPRING_MONGODB_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: backend-secret
  #       key: mongodb-password

# Optional: List of ConfigMaps or Secrets to inject directly as environment variables
envFrom: []
# - secretRef:
#     name: backend-secrets
# - configMapRef:
#     name: backend-config

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
