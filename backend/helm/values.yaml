# Default values for backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: ghcr.io/nguyentukien/pharmagent-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# The port our Spring Boot application runs on inside the container
containerPort: 8080

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

# Default environment variables for local/testing.
# Can be overridden or extended in production using values files or GitOps repo.
env:
  - name: SPRING_MONGODB_DATABASE
    value: "PharmAgentDB"
  - name: SPRING_MONGODB_URI
    value: "mongodb://appUser:appPassword123@database:27017/PharmAgentDB?authSource=PharmAgentDB"
  - name: SPRING_DATA_REDIS_URL
    value: "redis://:hM3tdC4ETyAOXeoAtHjwKbHyTYJd6Wfq@redis:6379"
  - name: SPRING_RABBITMQ_ADDRESSES
    value: "amqp://guest:M9Em_GaseLCVB2pfFGVhoUD@rabbitmq:5672/"
  - name: SPRING_MAIL_HOST
    value: "smtp.gmail.com"
  - name: SPRING_MAIL_PORT
    value: "587"
  - name: JWT_SECRET
    value: "VGhpc0lzQURldlNlY3JldEtleUZvckpXVFNpZ25pbmdPbmx5ISE="
  - name: BACKEND_URL
    value: "http://backend:8080"
  - name: AGENT_URL
    value: "http://agent:8000"
  - name: CORS_ORIGINS
    value: "*"
  - name: APP_FRONTEND_URL
    value: "http://localhost:5173"
