server {
    listen 80;
    server_name localhost;

    # Tăng dung lượng upload (Rất quan trọng vì bạn gửi ảnh camera)
    client_max_body_size 20M;

    # 1. Spring Boot (Backend)
    location /api/ {
        proxy_pass http://backend:8080; # Không thêm / ở đây vì Spring đã có context-path /api
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Truyền thông tin IP thật của User
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng timeout cho WebSocket (Tránh bị ngắt kết nối khi đang chat)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 2. FastAPI AI Service (Agent)
    # User gọi: localhost/ai/api/pills/scan/ws
    # Nginx đẩy: agent:8000/api/pills/scan/ws
    location /ai/ {
        proxy_pass http://agent:8000/; # DẤU / Ở CUỐI LÀ CHÌA KHÓA
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket của AI cần phản hồi nhanh, không nên để timeout quá lâu
        proxy_read_timeout 600s;
    }
}