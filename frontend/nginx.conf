server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # ── Static files (React SPA) ──────────────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # LAYER 1 – PHÂN LOẠI THEO GIAO THỨC
    #   /ws/**  → toàn bộ WebSocket traffic   → gateway:9000
    #   /api/** → toàn bộ REST/HTTP traffic   → gateway:9000
    # Gateway sẽ phân loại tiếp theo service (backend / agent)
    # ═══════════════════════════════════════════════════════════════════════════

    # ── WebSocket (tất cả WS đi qua đây) ─────────────────────────────────────
    # Gateway nhận:
    #   /ws/agent → pill scan (agent)
    #   /ws/**    → STOMP chat (backend)
    location /ws/ {
        proxy_pass http://gateway:9000;   # giữ nguyên path /ws/**
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── REST / HTTP ───────────────────────────────────────────────────────────
    # Gateway nhận:
    #   /api/auth/**      → public (backend)
    #   /api/admin/**     → ADMIN only (backend)
    #   /api/agent/health → health check (agent)
    #   /api/**           → authenticated (backend)
    location /api/ {
        proxy_pass http://gateway:9000;   # giữ nguyên path /api/**
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}